name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow only reads the repo. No job needs write access.
permissions:
  contents: read

# Supersede in-flight runs for the same ref so a force-push doesn't leave stale
# jobs holding runner minutes (and, on a compromised action, extra dwell time).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in ~3 minutes; 15 bounds a hung install or a wedged test
    # instead of inheriting GitHub's 360-minute default.
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg            # headless matplotlib
    strategy:
      fail-fast: false
      matrix:
        include:
          # "pinned" gates the reproducibility claim: requirements.txt is documented as the
          # exact set that produced the published results, so CI must actually install it.
          # Previously CI installed unpinned packages and never read requirements.txt, which
          # meant a green check attested nothing about the published environment.
          - name: pinned
            install: requirements
          # "latest" gates forward compatibility and gives the Dependabot version-bump PRs
          # real signal (under the old workflow they passed regardless of the pin they changed).
          - name: latest
            install: latest
    name: test (${{ matrix.name }})
    steps:
      # Actions are pinned to immutable commit SHAs, not mutable tags: a tag can be
      # repointed at new code by the action's owner or a compromised account.
      # Dependabot updates these SHAs and keeps the trailing version comment in sync.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave a usable credential in .git/config for the rest of the job.
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only torch first: the PyPI wheel is the CUDA build (multi-GB) and this runner
      # has no GPU. Installing the exact pinned version here means the requirements.txt
      # install below finds it already satisfied rather than pulling the CUDA wheel.
      - name: Install CPU-only torch (pinned set)
        if: matrix.install == 'requirements'
        run: |
          python -m pip install --upgrade pip
          # --no-deps: only the torch wheel comes from the PyTorch index. Its dependencies
          # (setuptools, sympy, ...) are resolved from PyPI by the next step — the PyTorch
          # index carries an old setuptools (78.1.0) with known advisories.
          pip install --no-deps torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install pinned dependencies
        if: matrix.install == 'requirements'
        run: pip install -r requirements.txt

      - name: Install latest dependencies (CPU-only torch)
        if: matrix.install == 'latest'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy scikit-learn statsmodels matplotlib seaborn tqdm yfinance requests

      - name: Install dev tooling
        # Test/lint tools are deliberately unpinned — they are not part of the
        # reproducibility claim that requirements.txt encodes. arch is a test-only oracle
        # (tests/test_reference_implementations.py checks the block-length estimator against
        # it) and hypothesis drives tests/test_properties.py; their requirements are already
        # met by the pins, so pip's default only-if-needed strategy leaves the pinned
        # numpy/scipy/pandas/statsmodels untouched.
        run: pip install pytest pytest-cov ruff arch hypothesis

      - name: Dependency vulnerability scan (pip-audit)
        # CodeQL analyses source code; it does not look at the dependency manifest.
        # v32: two passes. (1) The environment this job installed: every transitive
        # dependency at the version actually tested. The CPU wheel installs as torch
        # 2.13.0+cpu, which PyPI does not know, so this pass skips torch. (2) Each pin in
        # requirements.txt by its public version — torch==2.13.0 included — without
        # resolving (or downloading) the CUDA stack.
        # Deliberately no --ignore-vuln list: a new advisory should turn CI red.
        if: matrix.install == 'requirements'
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off
          pip-audit --progress-spinner off --no-deps --disable-pip -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Byte-compile all Python (syntax gate)
        # Covers the package, the test suite, and the publicly shipped scripts/ —
        # the previous step compiled only pairs_trading/ despite being named "all modules".
        run: python -m compileall -q pairs_trading tests scripts

      - name: Synthetic known-answer validation
        # The engine must find a planted edge, find none in non-cointegrated (random-walk spread) pairs
        # (a positive gross mean there would be look-ahead), recover the true hedge
        # ratio, and select the planted pairs. Two seeds keep this to ~90 s.
        if: matrix.install == 'requirements'
        run: python scripts/synthetic_validation.py --seeds 2 --out synthetic_validation.json

      - name: Run test suite (with coverage)
        # Per-module report in the log; fail-under is a regression floor set just under the
        # current total (89% in v32). v32 added a synthetic market with known answers, so the
        # whole pipeline — selection, backtest, walk-forward, significance, benchmarks, fund
        # replay, exports — runs hermetically in CI (it was 29% when nothing ran end to end).
        run: pytest -q --cov=pairs_trading --cov-report=term-missing --cov-fail-under=85
